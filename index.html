<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Master - MVVM Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app" class="container">
        <h1>Task Master (MVVM)</h1>
       
        <form id="taskForm" class="form-group">
            <input type="text" id="taskTitle" placeholder="O que precisa ser feito?" required>
            <input type="text" id="taskDescription" placeholder="Descrição">
            <input type="date" id="taskDueDate" required>
            <button id="addBtn" type="submit">Adicionar</button>
            <button id="cancelBtn" type="button" hidden>Cancelar edição</button>
        </form>

        <ul id="taskList"></ul>
    </div>

    <script src="js/TaskViewModel.js"></script>
</body>
</html>
